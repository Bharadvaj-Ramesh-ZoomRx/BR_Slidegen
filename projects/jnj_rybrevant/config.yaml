# ══════════════════════════════════════════════════════════════════════════════
# J&J Rybrevant PET Q4'25 — Project Configuration
# ══════════════════════════════════════════════════════════════════════════════

project:
  name: "J&J Rybrevant PET"
  client: "Johnson & Johnson"
  wave: "PET_Q3Q4_2025"
  period_current: "Q4'25"
  period_prior: "Q3'25"

# ── Synapse Integration (optional) ───────────────────────────────────────────
# Used by `python -m slidegen fetch-synapse` to download banner plan data.
# Set SYNAPSE_API_KEY env var with an Azure AD bearer token before running.
# synapse:
#   api_url: "https://synapse.zoomrx.com/api"
#   project_id: 0          # ← fill in from Synapse portal
#   survey_ids: []          # ← fill in from Synapse portal
#   deliverable_ids: []     # ← fill in from Synapse portal
#   segment_ids: []         # ← fill in from Synapse portal
#   multi_question_analysis_ids: []
#   virtual_question_analysis_ids: []

# ── Paths ────────────────────────────────────────────────────────────────────
# {{wave}} is interpolated at load time from project.wave above
# Template stays flat (shared across waves); data/output are wave-versioned
data_source_path: "input/wave/{{wave}}/source_data.xlsx"
template_path: "templates/template.pptx"
section_icon_path: "templates/section_icon.png"
output_path: "output/{{wave}}/deck.pptx"
context_path: "context/{{wave}}/"

# ── PowerPoint Sections ───────────────────────────────────────────────────────
# Each section starts at the named ask and runs until the next section begins
sections:
  - name: "Introduction"
    start: cover
  - name: "Messaging — Recall & Delivery"
    start: ryb_mr_leaderboard
  - name: "Messaging — Effectiveness"
    start: ryb_mr_me
  - name: "Interactions — Setup & Tactics"
    start: share_of_time
  - name: "Rep Performance"
    start: rep_perf
  - name: "Prescription Intent & Impact"
    start: rx_intent
  - name: "Branded Close / CTA"
    start: cta
  - name: "Drivers of High Impact"
    start: hii_compare
  - name: "Appendix"
    start: tag_mr

# ── Brands ───────────────────────────────────────────────────────────────────
brands:
  primary:
    name: "RYB+LAZ"
    full_name: "Rybrevant + Lazcluze"
    color_current: "#F75824"
    color_prior: "#FFC199"
  competitor:
    name: "Tagrisso"
    full_name: "AZ Tagrisso"
    color_current: "#7030A0"
    color_prior: "#AD88C8"

# ── Fonts ────────────────────────────────────────────────────────────────────
fonts:
  display: "Johnson Display"
  body: "Johnson Text"

# ── Excel Sheet Layout ──────────────────────────────────────────────────────
sheets:
  primary:
    name: "RYB"
    q_prior_col: 7      # col H = Q3 Total
    q_current_col: 17   # col R = Q4 Total
  competitor:
    name: "TAG"
    q_prior_col: 7      # col H = Q3 Total
    q_current_col: 13   # col N = Q4 Total
  analysis:
    name: "Additonal Analysis"   # note: misspelled in source
    q_prior_col: 2
    q_current_col: 3

# ── Sample Sizes ─────────────────────────────────────────────────────────────
sample_sizes:
  primary:   { prior: 103, current: 100 }
  competitor: { prior: 73, current: 73 }

# ── Label Shortcuts ──────────────────────────────────────────────────────────
# Keyword-based label shortening for long survey text
label_shortcuts:
  - keywords: ["overall quality of sales call"]
    short: "Overall call quality"
  - keywords: ["knowledgeable", "competitor"]
    short: "Knowledge: competitors"
  - keywords: ["knowledgeable", "exon 20"]
    short: "Knowledge: EGFR Exon 20"
  - keywords: ["knowledgeable", "product"]
    short: "Knowledge: product (RYB)"
  - keywords: ["knowledgeable", "egfr"]
    short: "Knowledge: EGFR mNSCLC"
  - keywords: ["knowledgeable"]
    short: "Knowledge: product"
  - keywords: ["organized"]
    short: "Organized presentation"
  - keywords: ["compelling reason to prescribe"]
    short: "Compelling reason to Rx"
  - keywords: ["compelling reason to use broader"]
    short: "Compelling: mol. testing"
  - keywords: ["credible support"]
    short: "Credible product claims"
  - keywords: ["prepared", "conversation"]
    short: "Prepared for conversation"
  - keywords: ["prepared"]
    short: "Prepared presentation"
  - keywords: ["engaging", "discussing"]
    short: "Engaging discussion"
  - keywords: ["meaningful questions"]
    short: "Meaningful questions"
  - keywords: ["valuable use of my time"]
    short: "Valuable use of time"
  - keywords: ["address my questions"]
    short: "Addressed Rx questions"
  - keywords: ["delivering a clear message"]
    short: "Clear product message"
  - keywords: ["tailor", "discussions"]
    short: "Tailored discussion"
  - keywords: ["relevant to your practice"]
    short: "Relevant to practice"

# ── Data Extractions ────────────────────────────────────────────────────────
# Each extraction pulls a data block into a named key
extractions:
  # Ask 1: RYB Message Recall
  - id: ryb_mr
    method: question_code
    sheet: primary
    params: { code: "Q2_10Z", max_rows: 20 }

  # Ask 2: TAG Message Recall
  - id: tag_mr
    method: question_code
    sheet: competitor
    params:
      code: "Q2_10Z"
      max_rows: 20
      label_shortcuts:
        - keywords: ["CNS metastasis at diag"]
          short: "CNS mPFS w/ chemo"
        - keywords: ["29.4"]
          short: "mPFS 29.4mo (chemo)"
        - keywords: ["mPFS"]
          short: "mPFS (chemo)"
        - keywords: ["89%"]
          short: "89% stay on treatment"
        - keywords: ["Grade 1"]
          short: "ARs mostly Gr1/2"
        - keywords: ["onset frequency and severity"]
          short: "Onset/severity reduces"
        - keywords: ["Longest"]
          short: "Longest mPFS & mOS"
        - keywords: ["47.5"]
          short: "Final OS 47.5mo"
        - keywords: ["NCCN"]
          short: "NCCN Cat 1 (mono+chemo)"
        - keywords: ["30.5"]
          short: "Median exposure 30.5mo"
        - keywords: ["43%"]
          short: "43% risk reduction (chemo)"
        - keywords: ["once-daily"]
          short: "Once-daily oral dosing"
        - keywords: ["convenient"]
          short: "Once-daily oral dosing"

  # Ask 1 supplement: RYB Message Effectiveness from AA sheet
  - id: ryb_me
    method: row_range
    sheet: analysis
    params:
      row_start: 30
      row_end: 40
      col_map:
        label: 1
        short: 2
        mr_prior: 3
        mr_current: 4
        believ_prior: 5
        believ_current: 6
        me_prior: 7
        me_current: 8

  # Ask 3: Rep Performance
  - id: rep_perf
    method: row_range
    sheet: analysis
    params:
      row_start: 4
      row_end: 25
      col_map:
        label: 1
        primary_prior: 2
        primary_current: 3
        comp_prior: 4
        comp_current: 5
      use_label_shortcuts: true

  # Ask 5: CTA — RYB
  - id: ryb_cta
    method: multi_question_code
    sheet: primary
    params:
      codes:
        - { code: "C1_81Z", label: "Compelling reason to prescribe" }
        - { code: "C1_82Z", label: "Changed opinion" }
        - { code: "C1_83D1Z", label: "Asked to prescribe (Branded closing)" }
        - { code: "Q1_84bZ", label: "Educational ask" }

  # Ask 5: CTA — TAG
  - id: tag_cta
    method: multi_question_code
    sheet: competitor
    params:
      codes:
        - { code: "C1_81_TAG_mNSCLC_Z", label: "Compelling reason to prescribe" }
        - { code: "C1_82_TAG_mNSCLC_Z", label: "Changed opinion" }
        - { code: "C1_83D_TAG_mNSCLC_Z", label: "Asked to prescribe (Branded closing)" }
        - { code: "C1_84b_TAG_mNSCLC_Z", label: "Educational ask" }

  # Ask 7: Follow-up reps
  - id: ryb_followup
    method: question_code
    sheet: primary
    params:
      code: "C1_84FZ"
      max_rows: 12
      label_shortcuts:
        - keywords: ["Medical Science Liaison"]
          short: "MSL"
        - keywords: ["Key Account Manager"]
          short: "KAM"
        - keywords: ["Field Reimbursement"]
          short: "FRM"
        - keywords: ["Clinical Nurse Educator"]
          short: "CNE"
        - keywords: ["No, I did not"]
          short: "No follow-up set"

  # Ask 8: Rx Intent — RYB
  - id: ryb_rx
    method: question_code
    sheet: primary
    params: { code: "C1_85DZ", max_rows: 8 }

  # Ask 8: Rx Intent — TAG
  - id: tag_rx
    method: question_code
    sheet: competitor
    params: { code: "C1_85D_TAG2_mNSCLCZ", max_rows: 8 }

  # Ask 9: Share of Time
  - id: share_of_time
    method: row_range
    sheet: analysis
    params:
      row_start: 197
      row_end: 205
      col_map: { label: 3, prior: 4, current: 7 }
      pct_mode: straight   # values already percentages

  # Quality metrics (Q1_87Z)
  - id: ryb_quality
    method: question_code
    sheet: primary
    params: { code: "Q1_87Z", max_rows: 20, use_label_shortcuts: true }

  # HII Compare (col 19=Others Q4, col 20=HI Q4)
  - id: hii_compare
    method: question_code_multi_col
    sheet: primary
    params:
      code: "Q1_87Z"
      max_rows: 20
      columns: { hi_current: 20, other_current: 19 }
      use_label_shortcuts: true
      min_diff: 3

  # Mariposa rep performance (AA rows 134-151)
  - id: mariposa_rep
    method: row_range
    sheet: analysis
    params:
      row_start: 136
      row_end: 151
      col_map:
        label: 2
        overall: 3
        segment_a: 4
        segment_b: 5
      use_label_shortcuts: true

  # TAG recall order (Q2_20Z, rows 250-302)
  - id: tag_recall_order
    method: nested_ordinal
    sheet: competitor
    params:
      row_start: 250
      row_end: 303
      code_col: 0
      desc_col: 1
      ordinal_col: 2
      ordinals: ["1st", "2nd", "3rd", "4th"]

  # ── NEW: Slide Plan Gap Extractions ────────────────────────────────────────

  # Slide 4: Message Recall by Practice Setting (Q4 Academic vs Community)
  - id: ryb_mr_ps
    method: question_code_multi_col
    sheet: primary
    params:
      code: "Q2_10Z"
      max_rows: 20
      columns: { acad_current: 23, comm_current: 24 }

  # Slide 6: Message Recall by Visual Aid Usage (AA rows 71-80)
  - id: va_mr_impact
    method: row_range
    sheet: analysis
    params:
      row_start: 71
      row_end: 81
      col_map:
        label: 2
        no_va: 3
        yes_va: 4

  # Slide 15: Rep Performance by Practice Setting (Q4 Academic vs Community)
  - id: rep_perf_ps
    method: question_code_multi_col
    sheet: primary
    params:
      code: "Q1_87Z"
      max_rows: 20
      columns: { acad_current: 23, comm_current: 24 }
      use_label_shortcuts: true

  # Slide 17: Product Perception Change by HII (Q1_86Z, Q4 HII vs Others)
  - id: perception_hii
    method: question_code_multi_col
    sheet: primary
    params:
      code: "Q1_86Z"
      max_rows: 25
      columns: { hi_current: 20, other_current: 19 }
      label_shortcuts:
        - keywords: ["Specific Indication"]
          short: "Indication"
        - keywords: ["Efficacy"]
          short: "Efficacy"
        - keywords: ["Safety", "side"]
          short: "Safety / Side effects"
        - keywords: ["Tolerability"]
          short: "Tolerability"
        - keywords: ["NCCN"]
          short: "NCCN Guidelines"
        - keywords: ["Patient types"]
          short: "Patient types"
        - keywords: ["Mutation"]
          short: "Mutation testing"
        - keywords: ["Dosing"]
          short: "Dosing / Treatment duration"
        - keywords: ["Route of Admin"]
          short: "Route of Administration"
        - keywords: ["Mechanism"]
          short: "Mechanism of Action"
        - keywords: ["Overall"]
          short: "Overall perception"
        - keywords: ["Patient support"]
          short: "Patient support program"
        - keywords: ["Proactive"]
          short: "Proactive supportive care"

  # Slide 21: Message Recall by HII (Q2_10Z, Q4 HII vs Others)
  - id: hii_mr
    method: question_code_multi_col
    sheet: primary
    params:
      code: "Q2_10Z"
      max_rows: 20
      columns: { hi_current: 20, other_current: 19 }


# ── Asks (Slides) ───────────────────────────────────────────────────────────
# Ordered to match the Slide Plan (Q4 2025) narrative flow
asks:
  # ══════════════════════════════════════════════════════════════════════════
  # SECTION: Introduction
  # ══════════════════════════════════════════════════════════════════════════
  - id: cover
    slide_type: cover
    headline: "{{primary.full_name}} Promotional Effectiveness\nTracking {{period_current}} Report"
    section: ""
    source_text: ""
    data_key: ""
    extra:
      subtitle: "Answers to key strategic asks"
      date: "March 2026"
      client: "{{client}}"

  - id: executive_summary
    slide_type: executive_summary
    headline: "Executive Summary — Key Insights from {{period_current}}"
    section: ""
    source_text: "Source: Lung SFEA SB — {{period_prior}} & {{period_current}}"
    data_key: ""

  # ══════════════════════════════════════════════════════════════════════════
  # SECTION: Messaging — Recall & Delivery (Slide Plan 3, 4, 6)
  # ══════════════════════════════════════════════════════════════════════════

  # Slide Plan 3 — Message Recall Leaderboard (MR only, QoQ)
  - id: ryb_mr_leaderboard
    slide_type: single_bar_with_delta
    headline: "NCCN-NSCLC leads recall; OS and CNS messages declined QoQ — partially attributable to textual modifications"
    section: "{{primary.full_name}} MESSAGE RECALL — {{period_current}} vs {{period_prior}}"
    source_text: "Source: Lung SFEA SB Q2_10Z | Aided Message Recall | (n={{period_current}}: 100, {{period_prior}}: 103)"
    data_key: ryb_mr
    brand: primary
    sort_by: current

  # Slide Plan 4 — Message Recall by Practice Setting
  - id: ryb_mr_by_setting
    slide_type: clustered_compare
    headline: "Community HCPs recall OS and CNS at substantially lower rates than academics"
    section: "MESSAGE RECALL BY PRACTICE SETTING — {{primary.name}} — {{period_current}}"
    source_text: "Source: Lung SFEA SB Q2_10Z | Aided Message Recall | Academic (n=27), Community (n=73)"
    data_key: ryb_mr_ps
    sort_by: acad_current
    extra:
      series:
        - { field: "acad", label: "Academic (n=27)", color: "#F75824" }
        - { field: "comm", label: "Community (n=73)", color: "#FFC199" }
      gap_header: "Gap (pp)"

  # Slide Plan 6 — Visual Aid Usage & Impact on Recall
  - id: va_impact
    slide_type: clustered_compare
    headline: "Message recall more than doubles when visual aids are used — community VA usage gap is the key action lever"
    section: "VISUAL AID IMPACT ON MESSAGE RECALL — {{primary.name}} — {{period_current}}"
    source_text: "Source: Lung SFEA SB — Additonal Analysis | Aided Message Recall by VA Usage (Yes/No)"
    data_key: va_mr_impact
    sort_by: yes_va
    extra:
      series:
        - { field: "yes_va", label: "VA Used (n=44)", color: "#F75824" }
        - { field: "no_va", label: "No VA (n=56)", color: "#C0C0C0" }
      gap_header: "Gap (pp)"

  # ══════════════════════════════════════════════════════════════════════════
  # SECTION: Messaging — Effectiveness (Slide Plan 7, 8)
  # ══════════════════════════════════════════════════════════════════════════

  # Slide Plan 7 — Message Effectiveness (MR + ME Dual Bar)
  - id: ryb_mr_me
    slide_type: dual_bar_with_delta
    headline: "{{primary.name}} message recall declined broadly; new NCCN messages gained traction while effectiveness remained strong"
    section: "{{primary.full_name}} MESSAGE RECALL & EFFECTIVENESS — {{period_current}} vs {{period_prior}}"
    source_text: "Source: Lung SFEA SB Q2_10Z | MR = Message Recall, ME = Message Effectiveness | ^Message effectiveness is the geometric mean of % of high ratings (6, 7 out of 7) for motivation, differentiation, and believability attributes of messages"
    data_key: ryb_me
    brand: primary
    sort_by: mr_current
    extra:
      category_header: "Tag$"
      breadcrumb: "Key Findings - Personal Promotions"
      left:
        field_prefix: "mr"
        label: "Recall (IA = 35%)\n(s = 100)"
        delta_header: "Δ"
      right:
        field_prefix: "me"
        label: "Effectiveness^ (IA = 74%)\n(d = 41)"
        delta_header: "Δ"

  # Slide Plan 8 — ME: Believability & Composite Effectiveness
  - id: mbd
    slide_type: dual_bar_qoq
    headline: "Message effectiveness driven primarily by believability; composite effectiveness remained stable QoQ"
    section: "MESSAGE BELIEVABILITY & COMPOSITE EFFECTIVENESS — {{primary.name}} — {{period_current}} vs {{period_prior}}"
    source_text: "Source: Lung SFEA SB — Additonal Analysis | B = Believability, CE = Composite Effectiveness"
    data_key: ryb_me
    brand: primary
    sort_by: me_current
    extra:
      left: { field_prefix: "believ", label: "Believability (%)" }
      right: { field_prefix: "me", label: "Composite Effectiveness (%)" }

  # ══════════════════════════════════════════════════════════════════════════
  # SECTION: Interactions — Setup & Tactics (Slide Plan 11)
  # ══════════════════════════════════════════════════════════════════════════

  # Slide Plan 11 — Share of Interaction Time by Topic
  - id: share_of_time
    slide_type: qoq_bar_with_delta
    headline: "Efficacy discussions surged; safety and guidelines topics saw shifts"
    section: "SHARE OF INTERACTION TIME BY TOPIC — {{primary.name}} — {{period_current}} vs {{period_prior}}"
    source_text: "Source: Lung SFEA SB — VQ_Share_of_Time_RYB_SFEA | % of interactions"
    data_key: share_of_time
    brand: primary
    sort_by: current

  # Slide Plan 22 — MARIPOSA Prioritization & Impact
  - id: mariposa_rep_perf
    slide_type: clustered_compare
    headline: "MARIPOSA-first interactions show higher rep performance on compelling reason to Rx"
    section: "REP PERFORMANCE — MARIPOSA 1st DISCUSSED vs NOT — {{period_current}}"
    source_text: "Source: Lung SFEA SB — Additonal Analysis | Top 2 Box (6,7)"
    data_key: mariposa_rep
    sort_by: segment_a
    extra:
      series:
        - { field: "segment_a", label: "MARIPOSA 1st (n=79)" }
        - { field: "segment_b", label: "Not 1st (n=21)", color: "#BFBFBF" }

  # ══════════════════════════════════════════════════════════════════════════
  # SECTION: Rep Performance (Slide Plan 13, 14, 15)
  # ══════════════════════════════════════════════════════════════════════════

  # Slide Plan 13 — Rep Performance: RYB vs TAG Attribute Comparison
  - id: rep_perf
    slide_type: clustered_compare
    headline: "J&J reps lead AZ across most rep quality attributes, driven by implementation guide"
    section: "REP PERFORMANCE — J&J vs AZ — {{period_current}}"
    source_text: "Source: Lung SFEA SB — Sales_Rep_Effectiveness_PET_RF_2 | Top 2 Box (6,7)"
    data_key: rep_perf
    sort_by: primary_current
    extra:
      series:
        - { field: "primary", label: "J&J ({{primary.name}})" }
        - { field: "comp", label: "AZ ({{competitor.name}})" }

  # Slide Plan 14 — Rep Performance QoQ Trend
  - id: rep_perf_qoq
    slide_type: qoq_bar_with_delta
    headline: "Addressing HCP questions improved meaningfully QoQ; implementation guide drives gains on preparedness"
    section: "REP PERFORMANCE QoQ TREND — {{primary.name}} — {{period_current}} vs {{period_prior}}"
    source_text: "Source: Lung SFEA SB — Q1_87Z | Top 2 Box (6,7)"
    data_key: ryb_quality
    brand: primary
    sort_by: current

  # Slide Plan 15 — Rep Performance by Practice Setting
  - id: rep_perf_by_setting
    slide_type: clustered_compare
    headline: "Community lags on clarity and competitor knowledge — targeted VA usage for comparative data is the recommended lever"
    section: "REP PERFORMANCE BY PRACTICE SETTING — {{primary.name}} — {{period_current}}"
    source_text: "Source: Lung SFEA SB — Q1_87Z | Top 2 Box (6,7) | Academic (n=27), Community (n=73)"
    data_key: rep_perf_ps
    sort_by: acad_current
    extra:
      series:
        - { field: "acad", label: "Academic (n=27)", color: "#F75824" }
        - { field: "comm", label: "Community (n=73)", color: "#FFC199" }
      gap_header: "Gap (pp)"

  # ══════════════════════════════════════════════════════════════════════════
  # SECTION: Prescription Intent & Impact (Slide Plan 16, 17)
  # ══════════════════════════════════════════════════════════════════════════

  # Slide Plan 16 — LTIP: RYB vs TAG QoQ
  - id: rx_intent
    slide_type: two_section_bar
    headline: "{{primary.name}} intent to increase Rx rose sharply for patients w/o CNS; {{competitor.name}} chemo intent held steady"
    section: "PRESCRIPTION INTENT (INCREASE Rx) BY PATIENT TYPE — {{period_current}}"
    source_text: "Source: Lung SFEA SB — C1_85DZ (RYB), C1_85D_TAG2_mNSCLCZ (TAG) | Top 2 Box (6,7)"
    data_key: rx_combined
    extra:
      top: { data_key: "ryb_rx", label: "{{primary.name}} — Intent to Increase Rx", brand: "primary" }
      bottom: { data_key: "tag_rx", label: "{{competitor.name}}+Chemo — Intent to Increase Rx", brand: "competitor" }

  # Slide Plan 17 — Product Perception Change by HII
  - id: perception_change_hii
    slide_type: clustered_compare
    headline: "HII interactions drive stronger perception improvement on efficacy and NCCN — validating J&J's efficacy-first strategy"
    section: "PRODUCT PERCEPTION CHANGE POST-INTERACTION — HII vs OTHERS — {{period_current}}"
    source_text: "Source: Lung SFEA SB — Q1_86Z | Top 2 Box (6,7) | HII = Top Box Quality + T2B LTIP"
    data_key: perception_hii
    sort_by: hi_current
    extra:
      series:
        - { field: "hi", label: "High Impact (n=63)", color: "#F75824" }
        - { field: "other", label: "Non-High Impact (n=37)", color: "#C0C0C0" }

  # ══════════════════════════════════════════════════════════════════════════
  # SECTION: Branded Close / CTA (Slide Plan 18)
  # ══════════════════════════════════════════════════════════════════════════

  # Slide Plan 18 — Branded Closing & CTA
  - id: cta
    slide_type: clustered_compare
    headline: "{{primary.name}} reps improved on 'changed opinion'; branded closing dipped slightly vs {{period_prior}}"
    section: "CALL TO ACTION — J&J ({{primary.name}}) vs AZ ({{competitor.name}}) — {{period_current}}"
    source_text: "Source: Lung SFEA SB — C1_81Z, C1_82Z, C1_83D1Z, Q1_84bZ | Top Box / Yes%"
    data_key: cta_combined
    extra:
      primary_key: ryb_cta
      comp_key: tag_cta
      series:
        - { field: "primary", label: "J&J ({{primary.name}})" }
        - { field: "comp", label: "AZ ({{competitor.name}})" }

  - id: followup_reps
    slide_type: single_bar_with_delta
    headline: "Over half of HCPs did not set follow-up with other J&J reps; MSL referrals declined"
    section: "ONE J&J VISION — FOLLOW-UP WITH OTHER J&J REPRESENTATIVES — {{period_current}}"
    source_text: "Source: Lung SFEA SB — C1_84FZ | % of HCPs who set follow-up"
    data_key: ryb_followup
    brand: primary
    sort_by: current

  # ══════════════════════════════════════════════════════════════════════════
  # SECTION: Drivers of High Impact (Slide Plan 20, 21)
  # ══════════════════════════════════════════════════════════════════════════

  # Slide Plan 20 — HII: Rep Performance Attribute Comparison
  - id: hii_compare
    slide_type: clustered_compare
    headline: "High-impact interactions drive significantly higher rep quality scores across all key metrics"
    section: "HIGH IMPACT vs NON-HIGH IMPACT — REP PERFORMANCE — {{period_current}}"
